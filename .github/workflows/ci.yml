name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push: it may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create and drop their own scratch databases.
      HERON_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The optional monitor output (cpal) needs the ALSA headers on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo clippy -p heron-engine --features monitor --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The OpenAPI document is up to date
        run: |
          cargo run -q -p heron-api --locked -- openapi > web/openapi.json
          git diff --exit-code web/openapi.json

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/openapi/package-lock.json
      - run: npm ci
      - name: Client types match the OpenAPI document
        run: npm run generate-api && git diff --exit-code src/api/schema.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-spdx.sh

  monitoring:
    name: Monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.0 check config /etc/prometheus/prometheus.yml
      - name: Alertmanager configuration
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/heron.json >/dev/null
      - name: Compose file with every profile
        run: cp .env.example .env && docker compose --profile icecast --profile monitoring config -q

  compose:
    name: Docker Compose on ${{ matrix.arch }} (build, start, import, stream)
    # Native runners for both architectures: Heron must run on a Raspberry Pi.
    runs-on: ${{ matrix.runner }}
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: |
          cp .env.example .env && mkdir -p data/fallback data/incoming data/staging
          sed -i "s/^HERON_LIBRARIAN_USER=.*/HERON_LIBRARIAN_USER=$(id -u):$(id -g)/" .env
          # The tested images are the ones published, per architecture.
          echo "HERON_VERSION=sha-${GITHUB_SHA::7}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Generate a test library and fallback tracks
        # The generator runs as root in Docker; the librarian runs as us.
        run: |
          scripts/generate-test-library.sh data/music 60
          scripts/generate-test-library.sh data/fallback 3
          sudo chown -R "$(id -u):$(id -g)" data/music data/fallback
      - run: docker compose build
      # The icecast profile adds a local Icecast server for the streaming check.
      - run: docker compose --profile icecast up -d --wait --wait-timeout 300
      - name: Migrations were applied
        run: |
          docker compose exec -T mariadb \
            mariadb -uheron -pchange-me heron -N -e \
            "SELECT COUNT(*) FROM _sqlx_migrations WHERE success = 1" | grep -qv '^0$'
      - name: Web app reaches the API
        run: curl -fsS http://localhost:8000/api/v1/status | grep -q '"database":"ok"'
      - name: Every track is imported and analyzed
        run: scripts/wait-for-analysis.sh http://localhost:8000 60 300
      - name: The API puts the station on air
        run: scripts/check-streaming.sh
      - name: Files dropped or uploaded wait in the buffer zone, then are filed and analyzed
        run: |
          scripts/generate-test-library.sh "$RUNNER_TEMP/drop" 3
          cp -R "$RUNNER_TEMP/drop/." data/incoming/
          scripts/check-buffer.sh "$(find "$RUNNER_TEMP/drop" -type f -name '*.m4a' | sort | head -n 1)" 4
          scripts/wait-for-analysis.sh http://localhost:8000 64 300
          test -z "$(find data/incoming -type f)"
          ls "data/music/Artist 1/Album 1/" | grep -F "01 Track 1 (2).m4a"
      - name: Chaos tests (M3)
        run: scripts/chaos-test.sh
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested images
        if: github.event_name == 'push'
        run: docker compose push heron-api heron-analyzer heron-librarian heron-engine heron-web
      - if: failure()
        run: docker compose --profile icecast ps && docker compose --profile icecast logs
      - if: always()
        run: docker compose --profile icecast down -v

  publish:
    name: Publish ${{ matrix.image }}
    # Merges the tested amd64 and arm64 images into one multi-arch image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [heron-api, heron-analyzer, heron-librarian, heron-engine, heron-web]
    env:
      IMAGE: ghcr.io/dehy/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version in Cargo.toml and web/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml
          test "$(jq -r .version web/package.json)" = "$version"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Main publishes edge; a vX.Y.Z tag publishes X.Y.Z, X.Y and latest.
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch image
        run: |
          tags=()
          while read -r tag; do tags+=(--tag "$tag"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-${GITHUB_SHA::7}-amd64" "$IMAGE:sha-${GITHUB_SHA::7}-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"

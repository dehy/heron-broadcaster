name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create and drop their own scratch databases.
      HERON_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-spdx.sh

  compose:
    name: Docker Compose on ${{ matrix.arch }} (build, start, import)
    # Native runners for both architectures: Heron must run on a Raspberry Pi.
    runs-on: ${{ matrix.runner }}
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && mkdir -p data/fallback
      - name: Generate a test library
        run: scripts/generate-test-library.sh data/music 60
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Migrations were applied
        run: |
          docker compose exec -T mariadb \
            mariadb -uheron -pchange-me heron -N -e \
            "SELECT COUNT(*) FROM _sqlx_migrations WHERE success = 1" | grep -qv '^0$'
      - name: Web app reaches the API
        run: curl -fsS http://localhost:8000/api/v1/status | grep -q '"database":"ok"'
      - name: Every track is imported and analyzed
        run: scripts/wait-for-analysis.sh http://localhost:8000 60 300
      - if: failure()
        run: docker compose ps && docker compose logs
      - if: always()
        run: docker compose down -v

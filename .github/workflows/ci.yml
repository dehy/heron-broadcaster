# SPDX-License-Identifier: AGPL-3.0-or-later

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push: it may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create and drop their own scratch databases.
      HERON_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      # The tests run under cargo-llvm-cov, for SonarQube Cloud's coverage.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The optional monitor output (cpal) needs the ALSA headers on Linux.
      # mariadb-client: the e2e tests take backups with mariadb-dump.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev mariadb-client
      - run: cargo clippy -p heron-engine --features monitor --all-targets --locked -- -D warnings
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: lcov.info
          retention-days: 1
      - name: The OpenAPI document is up to date
        run: |
          cargo run -q -p heron-api --locked -- openapi > web/openapi.json
          git diff --exit-code web/openapi.json

  rust-aac:
    name: Rust (AAC-LC encoder)
    runs-on: ubuntu-latest
    # The `aac` feature links libavcodec 7.1, which Debian trixie ships (the
    # runner's Ubuntu does not): same base image as docker/rust.Dockerfile.
    container: rust:1.99.1-slim-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          apt-get update && apt-get install -y --no-install-recommends
          g++ make pkg-config clang libclang-dev
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
      - run: rustup component add clippy
      - run: cargo clippy -p heron-outputs --features aac --all-targets --locked -- -D warnings
      - run: cargo test -p heron-outputs --features aac --locked

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/openapi/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Client types match the OpenAPI document
        run: npm run generate-api && git diff --exit-code src/api/schema.ts
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 1

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-spdx.sh

  monitoring:
    name: Monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/rules:ro" \
            prom/prometheus:v3.7.0 check rules /rules/alerts.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana/heron-dashboard.json >/dev/null

  sonarqube:
    name: SonarQube Cloud
    # A tag would be analyzed as a branch of its own.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    # The coverage reports come from the tests.
    needs: [rust, web]
    env:
      # Empty on pull requests from forks: the analysis is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Blame data and new-code detection need the full history.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SONAR_TOKEN != ''
        with:
          pattern: coverage-*
          path: coverage
      # Settings in sonar-project.properties.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: env.SONAR_TOKEN != ''

  compose:
    name: Docker Compose on ${{ matrix.arch }} (build, start, import, stream)
    # Native runners for both architectures: Heron must run on a Raspberry Pi.
    runs-on: ${{ matrix.runner }}
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cp .env.example .env && mkdir -p data/fallback data/incoming data/staging data/backups
          sed -i "s/^HERON_LIBRARIAN_USER=.*/HERON_LIBRARIAN_USER=$(id -u):$(id -g)/" .env
          # The tested images are the ones published, per architecture.
          echo "HERON_VERSION=sha-${GITHUB_SHA::7}-${{ matrix.arch }}" >> "$GITHUB_ENV"
          # Built into the services and heron-web (which check they match), and
          # shown on the About page.
          echo "HERON_REVISION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "HERON_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Images go to the packages of the repository's owner (a fork's own).
          echo "HERON_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Generate a test library and fallback tracks
        # The generator runs as root in Docker; the librarian runs as us.
        run: |
          scripts/generate-test-library.sh data/music 60
          scripts/generate-test-library.sh data/fallback 3
          sudo chown -R "$(id -u):$(id -g)" data/music data/fallback
      - run: docker compose build
      # The icecast profile adds a local Icecast server for the streaming check.
      - run: docker compose --profile icecast up -d --wait --wait-timeout 300
      - name: Migrations were applied
        run: |
          docker compose exec -T mariadb \
            mariadb -uheron -pchange-me heron -N -e \
            "SELECT COUNT(*) FROM _sqlx_migrations WHERE success = 1" | grep -qv '^0$'
      - name: Web app reaches the API
        run: curl -fsS http://localhost:8000/api/v1/status | grep -q '"database":"ok"'
      - name: Every track is imported and analyzed
        run: scripts/wait-for-analysis.sh http://localhost:8000 60 300
      - name: The API puts the station on air
        run: scripts/check-streaming.sh
      - name: Files dropped or uploaded wait in the buffer zone, then are filed and analyzed
        run: |
          scripts/generate-test-library.sh "$RUNNER_TEMP/drop" 3
          cp -R "$RUNNER_TEMP/drop/." data/incoming/
          scripts/check-buffer.sh "$(find "$RUNNER_TEMP/drop" -type f -name '*.m4a' | sort | head -n 1)" 4
          scripts/wait-for-analysis.sh http://localhost:8000 64 300
          test -z "$(find data/incoming -type f)"
          ls "data/music/Artist 1/Album 1/" | grep -F "01 Track 1 (2).m4a"
      - name: A backup holds the configuration and a database dump
        run: |
          name=$(docker compose exec -T heron-api heron-api backup create)
          test -s "data/backups/heron-config-$name.json"
          gunzip -c "data/backups/heron-database-$name.sql.gz" | grep -q 'CREATE TABLE `tracks`'
          test "$(stat -c %a "data/backups/heron-config-$name.json")" = 600
      - name: Chaos tests (M3)
        run: scripts/chaos-test.sh
      - name: Two stations, upgraded, and a backup restored on air (M12, M13)
        run: scripts/check-two-stations.sh
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested images
        if: github.event_name == 'push'
        run: docker compose push heron-api heron-analyzer heron-librarian heron-engine heron-web
      - if: failure()
        run: docker compose --profile icecast ps && docker compose --profile icecast logs
      - if: always()
        run: docker compose --profile icecast down -v

  publish:
    name: Publish ${{ matrix.image }}
    # Merges the tested amd64 and arm64 images into one multi-arch image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [heron-api, heron-analyzer, heron-librarian, heron-engine, heron-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages of the repository's owner (a fork's own); GHCR names
      # are lowercase.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
      - name: The tag matches the version in Cargo.toml and web/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml
          test "$(jq -r .version web/package.json)" = "$version"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Main publishes edge; a vX.Y.Z tag publishes X.Y.Z, X.Y and latest.
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch image
        run: |
          tags=()
          while read -r tag; do tags+=(--tag "$tag"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-${GITHUB_SHA::7}-amd64" "$IMAGE:sha-${GITHUB_SHA::7}-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"

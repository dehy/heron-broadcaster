name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests create and drop their own scratch databases.
      HERON_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The optional monitor output (cpal) needs the ALSA headers on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo clippy -p heron-engine --features monitor --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The OpenAPI document is up to date
        run: |
          cargo run -q -p heron-api --locked -- openapi > web/openapi.json
          git diff --exit-code web/openapi.json

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/openapi/package-lock.json
      - run: npm ci
      - name: Client types match the OpenAPI document
        run: npm run generate-api && git diff --exit-code src/api/schema.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-spdx.sh

  compose:
    name: Docker Compose on ${{ matrix.arch }} (build, start, import, stream)
    # Native runners for both architectures: Heron must run on a Raspberry Pi.
    runs-on: ${{ matrix.runner }}
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: |
          cp .env.example .env && mkdir -p data/fallback data/incoming
          sed -i "s/^HERON_LIBRARIAN_USER=.*/HERON_LIBRARIAN_USER=$(id -u):$(id -g)/" .env
      - name: Generate a test library
        # The generator runs as root in Docker; the librarian runs as us.
        run: |
          scripts/generate-test-library.sh data/music 60
          sudo chown -R "$(id -u):$(id -g)" data/music
      - run: docker compose build
      # The icecast profile adds a local Icecast server for the streaming check.
      - run: docker compose --profile icecast up -d --wait --wait-timeout 300
      - name: Migrations were applied
        run: |
          docker compose exec -T mariadb \
            mariadb -uheron -pchange-me heron -N -e \
            "SELECT COUNT(*) FROM _sqlx_migrations WHERE success = 1" | grep -qv '^0$'
      - name: Web app reaches the API
        run: curl -fsS http://localhost:8000/api/v1/status | grep -q '"database":"ok"'
      - name: Every track is imported and analyzed
        run: scripts/wait-for-analysis.sh http://localhost:8000 60 300
      - name: The API puts the station on air
        run: scripts/check-streaming.sh
      - name: Files dropped into the incoming folder are filed and analyzed
        run: |
          scripts/generate-test-library.sh "$RUNNER_TEMP/drop" 3
          cp -R "$RUNNER_TEMP/drop/." data/incoming/
          scripts/wait-for-analysis.sh http://localhost:8000 63 300
          test -z "$(find data/incoming -type f)"
          ls "data/music/Artist 1/Album 1/" | grep -F "01 Track 1 (2).m4a"
      - if: failure()
        run: docker compose --profile icecast ps && docker compose --profile icecast logs
      - if: always()
        run: docker compose --profile icecast down -v

#
# Serves the static web app and proxies /api to heron-api.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve heron-api per request through Docker's DNS, so nginx starts
    # (and recovers) even when the API container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $heron_api http://heron-api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration of the web app, written from the container's
    # environment at startup (docker/web-config.sh).
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass $heron_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (live state, M4).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Upload chunks (16 MiB at most), passed on as they arrive. A regex:
    # a prefix ending with a slash would redirect `/api/v1/staging/uploads`.
    location ~ ^/api/v1/staging/uploads/[0-9]+$ {
        client_max_body_size 17m;
        proxy_request_buffering off;
        proxy_pass $heron_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

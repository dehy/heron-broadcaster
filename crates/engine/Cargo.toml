[package]
name = "heron-engine"
description = "Heron Broadcaster real-time playout engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "heron-engine"
path = "src/main.rs"

[features]
# Local monitor output on the default sound card. Needs ALSA headers on Linux
# (libasound2-dev); Docker images are built without it.
monitor = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
cpal = { workspace = true, optional = true }
heron-analysis.workspace = true
heron-core.workspace = true
heron-dsp.workspace = true
heron-outputs.workspace = true
heron-proto.workspace = true
heron-service.workspace = true
lofty.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
rtrb.workspace = true
rustix = { workspace = true, features = ["net"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true

[lints]
workspace = true

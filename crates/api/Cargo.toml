[package]
name = "heron-api"
description = "Heron Broadcaster HTTP and WebSocket API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
heron-analysis = { workspace = true, features = ["mysql"] }
heron-core = { workspace = true, features = ["openapi"] }
heron-library.workspace = true
# Checks encoder profiles and outputs before they are saved.
heron-outputs.workspace = true
heron-proto.workspace = true
heron-service = { workspace = true, features = ["mysql"] }
metrics.workspace = true
notify.workspace = true
# Reads passwords without echoing them.
rustix = { workspace = true, features = ["termios"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
walkdir.workspace = true

[dev-dependencies]
# End-to-end tests drive a real engine, in process.
heron-engine.workspace = true
heron-service = { workspace = true, features = ["test-util"] }
hound.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true

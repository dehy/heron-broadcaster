[package]
name = "heron-analysis"
description = "Track analysis for Heron Broadcaster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Job queue in MariaDB, shared by the scanner (heron-api) and heron-analyzer.
mysql = ["dep:sqlx", "dep:serde_json"]

[dependencies]
base64.workspace = true
ebur128.workspace = true
heron-core.workspace = true
rusty-chromaprint.workspace = true
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
symphonia.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
heron-service = { workspace = true, features = ["test-util"] }
hound.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

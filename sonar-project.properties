# SPDX-License-Identifier: AGPL-3.0-or-later
#
# SonarQube Cloud analysis, run by the CI's sonarqube job. Automatic
# analysis is off: it skips Rust.

sonar.organization=dehy
sonar.projectKey=dehy_heron-broadcaster
sonar.projectName=heron-broadcaster

sonar.sources=.
sonar.tests=.
# Test files are excluded from the sources so they are indexed only once.
sonar.test.inclusions=crates/*/tests/**/*.rs,web/src/**/*.test.ts
# Generated from web/openapi.json (npm run generate-api). The migrations are
# MariaDB SQL, which the only SQL analyzer, PL/SQL (Oracle), misreads.
sonar.exclusions=web/src/api/schema.ts,migrations/**,crates/*/tests/**,web/src/**/*.test.ts
# Screenshots are not code.
sonar.global.exclusions=**/*.png
# Blocking calls are fine in tests: S7487 (process), S7488 (sleep), S7493
# (file). The end-to-end tests live in crates/api/src/e2e.rs.
sonar.issue.ignore.multicriteria=p1,p2,s1,s2,f1,f2
sonar.issue.ignore.multicriteria.p1.ruleKey=rust:S7487
sonar.issue.ignore.multicriteria.p1.resourceKey=crates/*/tests/**
sonar.issue.ignore.multicriteria.p2.ruleKey=rust:S7487
sonar.issue.ignore.multicriteria.p2.resourceKey=crates/api/src/e2e.rs
sonar.issue.ignore.multicriteria.s1.ruleKey=rust:S7488
sonar.issue.ignore.multicriteria.s1.resourceKey=crates/*/tests/**
sonar.issue.ignore.multicriteria.s2.ruleKey=rust:S7488
sonar.issue.ignore.multicriteria.s2.resourceKey=crates/api/src/e2e.rs
sonar.issue.ignore.multicriteria.f1.ruleKey=rust:S7493
sonar.issue.ignore.multicriteria.f1.resourceKey=crates/*/tests/**
sonar.issue.ignore.multicriteria.f2.ruleKey=rust:S7493
sonar.issue.ignore.multicriteria.f2.resourceKey=crates/api/src/e2e.rs
# The translation dictionaries mirror each other key for key.
sonar.cpd.exclusions=web/src/i18n/**

# Written by the rust and web jobs, downloaded by the sonarqube job.
sonar.rust.lcov.reportPaths=coverage/coverage-rust/lcov.info
sonar.javascript.lcov.reportPaths=coverage/coverage-web/lcov.info

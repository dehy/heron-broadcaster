#
# Loads the Heron dashboard into the bundled Grafana.

apiVersion: 1

providers:
  - name: heron
    folder: Heron
    type: file
    # Edits in the UI are kept until the next restart; save a copy to keep them.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

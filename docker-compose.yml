#
# Heron Broadcaster: one service per process. See docs/architecture.md.
# Copy .env.example to .env first.
#
# Priorities (docs/architecture.md#priorities): when the CPU is busy, it is
# shared by `cpu_shares`, so the engine comes first and the analyzer and the
# librarian last; when memory runs out, the kernel kills by `oom_score_adj`,
# the analyzer first and the engine last. Every service sets `cpu_shares`:
# some Docker versions map 1024 below the weight of a service without it.

name: heron

x-rust-env: &rust-env
  RUST_LOG: ${RUST_LOG:-info}
  HERON_LOG_FORMAT: json
  # Error reporting, off when empty. See docs/monitoring.md#sentry.
  HERON_SENTRY_DSN: ${HERON_SENTRY_DSN:-}
  HERON_SENTRY_ENVIRONMENT: ${HERON_SENTRY_ENVIRONMENT:-production}
  # Metrics pushed to Prometheus or Grafana Cloud (remote write), off when
  # the URL is empty. See docs/monitoring.md.
  HERON_STATION_NAME: ${HERON_STATION_NAME:-heron}
  HERON_METRICS_REMOTE_WRITE_URL: ${HERON_METRICS_REMOTE_WRITE_URL:-}
  HERON_METRICS_REMOTE_WRITE_USERNAME: ${HERON_METRICS_REMOTE_WRITE_USERNAME:-}
  HERON_METRICS_REMOTE_WRITE_PASSWORD: ${HERON_METRICS_REMOTE_WRITE_PASSWORD:-}
  HERON_METRICS_REMOTE_WRITE_INTERVAL: ${HERON_METRICS_REMOTE_WRITE_INTERVAL:-15}

x-database-url: &database-url mysql://heron:${HERON_DB_PASSWORD:?set HERON_DB_PASSWORD in .env}@mariadb:3306/heron

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    cpu_shares: 1024
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
    environment:
      MARIADB_DATABASE: heron
      MARIADB_USER: heron
      MARIADB_PASSWORD: ${HERON_DB_PASSWORD:?set HERON_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${HERON_DB_ROOT_PASSWORD:?set HERON_DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Applies the database migrations on startup, and feeds the engine.
  # Create the first admin with
  # `docker compose exec heron-api heron-api user add admin --role admin`.
  # It writes uploads into the buffer zone, shared with heron-librarian:
  # both run as HERON_LIBRARIAN_USER, the owner of that folder.
  heron-api:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: heron-api
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-api:${HERON_VERSION:-latest}
    restart: unless-stopped
    user: ${HERON_LIBRARIAN_USER:-10001:10001}
    cpu_shares: 1024
    environment:
      <<: *rust-env
      HERON_DATABASE_URL: *database-url
      HERON_ENGINE_URL: http://heron-engine:50051
      HERON_LIBRARY_DIR: /music
      HERON_STAGING_DIR: /staging
      HERON_SCAN_INTERVAL: ${HERON_SCAN_INTERVAL:-3600}
      HERON_LIBRARY_WATCH: ${HERON_LIBRARY_WATCH:-true}
    volumes:
      # Read-only: only heron-librarian writes to the library.
      - ${HERON_MUSIC_DIR:-./data/music}:/music:ro
      # Uploads wait there until they are imported.
      - ${HERON_STAGING_FOLDER:-./data/staging}:/staging
    depends_on:
      mariadb:
        condition: service_healthy

  heron-analyzer:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: heron-analyzer
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-analyzer:${HERON_VERSION:-latest}
    restart: unless-stopped
    # Background work: last for the CPU, first to go when memory runs out.
    # Its workers also run at nice 10 (HERON_NICE).
    cpu_shares: 256
    oom_score_adj: 500
    environment:
      <<: *rust-env
      HERON_DATABASE_URL: *database-url
      HERON_LIBRARY_DIR: /music
      HERON_NICE: ${HERON_NICE:-10}
    volumes:
      - ${HERON_MUSIC_DIR:-./data/music}:/music:ro
    depends_on:
      # Waits for the API so the schema is migrated first.
      heron-api:
        condition: service_healthy

  # New files (uploads, and files dropped into the incoming folder) wait in
  # the buffer zone, identified, until someone imports them; they are then
  # tagged and filed into the library. Deleted tracks go to its trash. The
  # only service with write access to the library.
  # It runs as the owner of your music folder: set HERON_LIBRARIAN_USER to
  # `$(id -u):$(id -g)` of that owner. Reorganize and undo with
  # `docker compose exec heron-librarian heron-librarian --help`.
  heron-librarian:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: heron-librarian
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-librarian:${HERON_VERSION:-latest}
    restart: unless-stopped
    # Background work, like the analyzer; nice 10 (HERON_NICE).
    cpu_shares: 256
    oom_score_adj: 300
    user: ${HERON_LIBRARIAN_USER:-10001:10001}
    environment:
      <<: *rust-env
      HERON_DATABASE_URL: *database-url
      HERON_LIBRARY_DIR: /music
      HERON_INCOMING_DIR: /incoming
      HERON_STAGING_DIR: /staging
      HERON_INCOMING_WATCH: ${HERON_LIBRARY_WATCH:-true}
      HERON_NICE: ${HERON_NICE:-10}
    volumes:
      - ${HERON_MUSIC_DIR:-./data/music}:/music
      - ${HERON_INCOMING_FOLDER:-./data/incoming}:/incoming
      - ${HERON_STAGING_FOLDER:-./data/staging}:/staging
    depends_on:
      # Waits for the API so the schema is migrated first.
      heron-api:
        condition: service_healthy

  # Deliberately depends on nothing: the air must stay on when everything else is down.
  # gRPC control on port 50051, inside the network only, used by heron-api.
  # `docker compose exec heron-engine heron-engine ctl --help` inspects it;
  # outputs and settings belong to the API, which replaces what ctl sets.
  heron-engine:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
      target: heron-engine
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-engine:${HERON_VERSION:-latest}
    restart: unless-stopped
    # Room for a hot handover to a new engine on upgrade (docs/upgrading.md).
    stop_grace_period: 30s
    # The air: first for the CPU, last to be killed when memory runs out.
    cpu_shares: 8192
    oom_score_adj: -500
    environment:
      <<: *rust-env
      HERON_LIBRARY_DIR: /music
      # Connections to stream servers go through heron-relay, so an upgrade
      # hands them over to the new engine (docs/handover.md).
      HERON_RELAY_SOCKET: /run/heron/relay/relay.sock
      # The external FFmpeg encoder's binary (docs/outputs.md), mounted with a
      # docker-compose.override.yml; ffmpeg on the PATH when empty.
      HERON_FFMPEG: ${HERON_FFMPEG:-}
    volumes:
      - ${HERON_MUSIC_DIR:-./data/music}:/music:ro
      - ${HERON_FALLBACK_DIR:-./data/fallback}:/var/lib/heron/fallback:ro
      # Configuration (outputs, playout settings) kept across restarts.
      - engine-state:/var/lib/heron/engine
      - engine-relay:/run/heron/relay

  # Holds the engine's connections to stream servers, so they outlive the
  # engine's container on upgrades. Tiny and seldom changed: scripts/upgrade.sh
  # leaves it running; restarting it is a short break covered by Icecast's
  # fallback mount. The engine connects directly while it is down.
  heron-relay:
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-engine:${HERON_VERSION:-latest}
    restart: unless-stopped
    cpu_shares: 8192
    oom_score_adj: -500
    command: ["relay"]
    environment:
      <<: *rust-env
      HERON_RELAY_SOCKET: /run/heron/relay/relay.sock
    volumes:
      - engine-relay:/run/heron/relay
    healthcheck:
      test: ["CMD", "heron-engine", "relay", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3

  # A local Icecast server to try outputs: `docker compose --profile icecast up -d`.
  # Source password `hackme`; listen on http://localhost:${HERON_ICECAST_PORT:-8010}/.
  # /live falls back to /fallback while the engine restarts (docs/upgrading.md).
  icecast:
    profiles: [icecast]
    image: libretime/icecast:2.4.4
    restart: unless-stopped
    # The image edits its configuration in place: start from a copy of ours.
    entrypoint: ["sh", "-c", "cp /etc/heron/icecast.xml /etc/icecast.xml && exec docker-entrypoint \"$$@\"", "--"]
    command: ["icecast", "-c", "/etc/icecast.xml"]
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_RELAY_PASSWORD: ${HERON_ICECAST_ADMIN_PASSWORD:-change-me}
      ICECAST_ADMIN_PASSWORD: ${HERON_ICECAST_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./docker/icecast/icecast.xml:/etc/heron/icecast.xml:ro
    ports:
      - "${HERON_ICECAST_PORT:-8010}:8000"

  # Loops the MP3 file of HERON_FALLBACK_STREAM_DIR (silence when there is
  # none) on Icecast's /fallback. It must be in the stream's format: MP3 128k,
  # 44.1 kHz, stereo.
  icecast-fallback:
    profiles: [icecast]
    image: linuxserver/ffmpeg:7.1.1
    restart: unless-stopped
    depends_on:
      - icecast
    entrypoint: ["/fallback-source.sh"]
    command: ["/fallback", "icecast://source:hackme@icecast:8000/fallback"]
    volumes:
      - ./docker/icecast/fallback-source.sh:/fallback-source.sh:ro
      - ${HERON_FALLBACK_STREAM_DIR:-./data/fallback-stream}:/fallback:ro

  heron-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: heron-web
    image: ${HERON_REGISTRY:-ghcr.io/dehy}/heron-web:${HERON_VERSION:-latest}
    restart: unless-stopped
    cpu_shares: 1024
    environment:
      # Error reporting from the browser, off when empty. A separate Sentry
      # project from the services' is advised: browsers can read this DSN.
      HERON_WEB_SENTRY_DSN: ${HERON_WEB_SENTRY_DSN:-}
      HERON_SENTRY_ENVIRONMENT: ${HERON_SENTRY_ENVIRONMENT:-production}
    ports:
      - "${HERON_HTTP_PORT:-8000}:80"

volumes:
  mariadb-data:
  engine-state:
  engine-relay:
